name: CI
on:
  push:
  pull_request:
jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - run: dotnet restore IssuePilot.slnx
      - run: dotnet build IssuePilot.slnx --no-restore --configuration Release
      - run: dotnet test IssuePilot.Tests/IssuePilot.Tests.csproj --no-build --configuration Release
